name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Build Linux binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          prefix="shockstock-${GOOS}-${GOARCH}"
          binary_name="${prefix}"
          archive_name="${prefix}.${{ matrix.archive }}"
          if [[ "${GOOS}" == "windows" ]]; then
            binary_name="${prefix}.exe"
          fi
          go build -trimpath -ldflags="-s -w" -o "${binary_name}" .
          if [[ "${{ matrix.archive }}" == "tar.gz" ]]; then
            tar -czf "${archive_name}" "${binary_name}"
          else
            zip "${archive_name}" "${binary_name}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: shockstock-${{ matrix.goos }}-${{ matrix.goarch }}
          path: shockstock-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: List release assets
        run: find release -maxdepth 1 -type f -print
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
