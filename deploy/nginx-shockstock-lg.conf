location = /lg {
    proxy_pass http://127.0.0.1:8080/lg;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /lg.css {
    proxy_pass http://127.0.0.1:8080/lg.css;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location = /lg.js {
    proxy_pass http://127.0.0.1:8080/lg.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location = /api/public/stock {
    proxy_pass http://127.0.0.1:8080/api/public/stock;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
